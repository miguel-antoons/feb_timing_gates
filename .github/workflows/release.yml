name: Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0, v2.1.0, etc.

permissions:
  contents: write # Required for tauri-action to create a GitHub release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build for Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

          # Build for macOS (x64) - explicitly use macos-13 (Intel)
          - platform: macos-13
            target: x86_64-apple-darwin

          # Build for macOS (ARM64) - explicitly use macos-14 (Apple Silicon)
          - platform: macos-14
            target: aarch64-apple-darwin

          # Build for Linux (x64)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest' || matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm install

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          # Point the action to where your package.json / tauri.conf.json is located
          projectPath: src/frontend
          
          # Pass the target from the matrix for correct cross-compilation/linking
          args: --target ${{ matrix.target }}
          
          # Automatically create and name the release based on the pushed tag
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false