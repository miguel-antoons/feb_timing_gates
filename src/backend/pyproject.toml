[project]
name = "feb-timing-backend"
version = "1.0.0"
description = "FEB Timing System Backend - FastAPI server for race timing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyserial>=3.5",
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Optional: Configure uv to create a virtual environment
# This will be used when running `uv sync`
